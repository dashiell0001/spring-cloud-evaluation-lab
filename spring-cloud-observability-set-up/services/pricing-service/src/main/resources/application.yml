server:
  port: 8081

spring:
  application:
    name: pricing-service
  config:
    import: "configserver:http://localhost:8090"

management:
  endpoints:
    web:
      exposure:
        include: health,info, metrics, prometheus, loggers
  endpoint:
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317
