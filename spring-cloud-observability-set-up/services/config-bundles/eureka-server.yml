server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    eviction-interval-timer-in-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    prometheus:
      enabled: true
  endpoint.health.probes.enabled: true
  tracing.sampling.probability: 1.0


otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317   # Jaeger OTLP if used
      protocol: grpc