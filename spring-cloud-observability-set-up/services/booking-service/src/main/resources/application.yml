server:
  port: 8082

spring:
  application:
    name: booking-service
  config:
    import: "configserver:http://localhost:8090"
  datasource:
    url: jdbc:postgresql://localhost:5433/bookings
    username: booking
    password: booking
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info, metrics, prometheus, loggers
  endpoint:
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317