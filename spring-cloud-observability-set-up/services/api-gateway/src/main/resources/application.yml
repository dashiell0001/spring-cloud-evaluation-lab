server:
  port: 8088

spring:
  application:
    name: api-gateway
  config:
    import: "configserver:http://localhost:8090"
  cloud:
    config:
      fail-fast: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,refresh,env, prometheus, loggers
  endpoint:
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317